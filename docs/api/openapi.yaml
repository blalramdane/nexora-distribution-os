openapi: 3.1.0
info:
  title: NEXORA Distribution OS API
  version: 1.0.0
  summary: API contract for the NEXORA distribution, inventory and field-sales application.
  description: |
    This document describes the HTTP API currently registered by the Laravel application.
    The base path is `/api/v1`. Protected routes use Sanctum bearer tokens and derive the
    organization/tenant from the authenticated user; clients must not send another tenant
    identifier to select a different organization. Business writes are reviewable operations
    and financial posting remains subject to server validation and tenant permissions.
    Rate limits are 60 requests per minute for guest IPs and 180 requests per minute per authenticated
    user; the login endpoint keeps its stricter five attempts per minute limit.
    For endpoints whose accepted fields are still being formalized, `OpenRequest` is an
    intentionally open object and is not a promise that arbitrary fields will be accepted.
servers:
  - url: /api/v1
    description: Same-origin/local deployment. Override the server URL for a separately hosted API.
tags:
  - name: Health
  - name: Authentication
  - name: Dashboard
  - name: Reports
  - name: Catalog
  - name: Customers
  - name: Suppliers
  - name: Inventory
  - name: Purchases
  - name: Purchase Imports
  - name: Sales
  - name: Administration
  - name: Invoice Sharing
  - name: Payments
  - name: Expenses
  - name: Returns
  - name: Trips
  - name: Field
  - name: Synchronization
  - name: Finance References
security:
  - bearerAuth: []
paths:
  /admin/access:
    get:
      tags: [Administration]
      operationId: getOrganizationAccess
      summary: Read users, organization roles and permissions
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/roles:
    post:
      tags: [Administration]
      operationId: createOrganizationRole
      summary: Create an organization role with an explicit permission set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users:
    post:
      tags: [Administration]
      operationId: createOrganizationUser
      summary: Create an active user and assign an existing organization role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API availability
      security: []
      responses:
        '200':
          description: API process is responding.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: nexora-distribution-api }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create a Sanctum token for an active organization user
      description: Limited to five attempts per minute. Login may be an email address or phone number.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              organization_id: 01JABCDEF01234567890123456
              login: admin@example.test
              password: example-only
              device_name: NEXORA Web
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current access token
      responses:
        '200':
          description: Current token revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Read current user, roles and permissions
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Read dashboard metrics for the current organization
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports:
    get:
      tags: [Reports]
      operationId: getOperationalReport
      summary: Read tenant-scoped operational and profit report for a date range
      description: |
        The maximum range is 367 calendar dates. Period totals use posted documents and date fields
        for each document type. Receivables, payables, and inventory are current snapshots, not
        historical period balances. Net profit is operational and excludes cash/stock variances;
        it is not a final tax statement. Net cost of goods sold can be negative where cost recovered
        from returns on prior-period invoices exceeds the cost of sales in the requested period.
        The current tax, foreign-currency and variance accounting
        policy decision gates still apply.
      parameters:
        - name: date_from
          in: query
          required: false
          description: First report date, inclusive. Defaults to the first day of the selected end-date month.
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: false
          description: Last report date, inclusive. Defaults to today in the organization's configured timezone.
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invoice-register:
    get:
      tags: [Reports]
      operationId: listUnifiedInvoiceRegister
      summary: List posted sales and purchase invoices in one tenant-scoped register
      description: |
        The register is read-only and shows invoice totals, paid amounts, posted returns and
        remaining balances. Summary amounts are grouped by currency and never added across currencies.
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [all, sales, purchases], default: all }
        - $ref: '#/components/parameters/SearchQuery'
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 10, maximum: 100, default: 25 }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Search and list catalog products
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Create a catalog product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Ulid' }
    get:
      tags: [Catalog]
      operationId: getProductDetails
      summary: Get editable details and the current purchase carton definition for a product
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalog]
      operationId: updateProduct
      summary: Update catalog details, price defaults and future carton conversion
      description: If a carton conversion changes, an existing packaging definition is versioned rather than overwritten so historic invoice snapshots stay valid. The inventory base unit cannot change for products with history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Catalog]
      operationId: deleteOrArchiveProduct
      summary: Permanently delete an unused catalog item or deactivate an item with history
      description: Products referenced by stock, invoices, movements, transfers or trip records are deactivated instead of permanently deleted. The response action is deleted or deactivated.
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/restore:
    post:
      tags: [Catalog]
      operationId: restoreProduct
      summary: Restore an archived catalog product without changing its stock or transaction history
      parameters:
        - name: productId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/pos:
    get:
      tags: [Catalog]
      operationId: getPosCatalog
      summary: Load catalog data optimized for the cashier screen
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /catalog/references:
    get:
      tags: [Catalog]
      operationId: getCatalogReferences
      summary: Load shared and organization catalog references such as units and categories
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories:
    post:
      tags: [Catalog]
      operationId: createCatalogCategory
      summary: Create an Arabic catalog category, optionally nested under a parent category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/{productId}/suppliers:
    post:
      tags: [Catalog, Suppliers]
      operationId: linkSupplierToExistingProduct
      summary: Add or update a supplier-specific code and purchase packaging for an existing catalog product
      description: Links the supplier to the existing product without creating a duplicate product record. Supplier cost is kept on the supplier-product relation.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierProductLinkRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Search and list customers belonging to the current organization
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{customerId}/prices:
    get:
      tags: [Customers]
      operationId: getCustomerProductPrices
      summary: List saved customer-specific prices by product and unit
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Customers]
      operationId: saveCustomerProductPrice
      summary: Upsert a saved selling price for one customer, product and unit
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerProductPriceRequest' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{customerId}:
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update customer master data within the current organization
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenRequest' }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{customerId}/360:
    get:
      tags: [Customers]
      operationId: getCustomer360
      summary: Read customer profile, invoice history, balances and payments
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/PerPage'
        - name: invoices_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: payments_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: returns_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers:
    get:
      tags: [Suppliers]
      operationId: listSuppliers
      summary: Search and list suppliers belonging to the current organization
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Suppliers]
      operationId: createSupplier
      summary: Register a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers/{supplierId}/360:
    get:
      tags: [Suppliers]
      operationId: getSupplier360
      summary: Read supplier history, invoices, returns, payments and open balance
      parameters:
        - $ref: '#/components/parameters/SupplierId'
        - $ref: '#/components/parameters/PerPage'
        - name: invoices_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: payments_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: returns_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers/{supplierId}/rebates:
    get:
      tags: [Suppliers]
      operationId: listSupplierRebates
      summary: List tracked supplier rebates earned by the current organization
      description: Rebate credits are reported separately from cash and supplier payable balances until their approved accounting treatment is posted.
      parameters:
        - $ref: '#/components/parameters/SupplierId'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Suppliers]
      operationId: accrueSupplierRebate
      summary: Calculate and record a rebate against previously unclaimed posted purchase invoices
      description: |
        The invoice total (after header discount and recorded tax) is snapshotted for each invoice.
        One purchase invoice may be included in at most one rebate. All invoices in one claim must
        share a currency. This records a rebate credit for review; it does not record cash or silently
        offset supplier payables or post a general-ledger journal.
      parameters:
        - $ref: '#/components/parameters/SupplierId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierRebateRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /inventory:
    get:
      tags: [Inventory]
      operationId: getInventory
      summary: Read stock balances and valuation by product and location
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inventory/adjust:
    post:
      tags: [Inventory]
      operationId: adjustInventory
      summary: Record a reviewed inventory adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /locations:
    get:
      tags: [Inventory]
      operationId: listLocations
      summary: List organization stock locations and warehouses
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Inventory]
      operationId: createWarehouseLocation
      summary: Create an active warehouse and its linked stock location atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWarehouseRequest' }
      responses:
        '201': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /purchases:
    post:
      tags: [Purchases]
      operationId: postPurchase
      summary: Post a purchase invoice and receive stock atomically
      description: |
        New catalog items can be supplied inline per item using `new_product` instead of
        `product_id`. The server validates tenant ownership and idempotency. The final invoice
        must reconcile with item values. Tax, certain discounts and multi-currency operations
        remain fail-closed pending explicit accounting policy approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequest' }
      responses:
        '201': { $ref: '#/components/responses/PostedDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /purchases/history:
    get:
      tags: [Purchases]
      operationId: listPurchaseHistory
      summary: Search purchase invoice history
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /purchases/open-balances:
    get:
      tags: [Purchases]
      operationId: listPurchaseOpenBalances
      summary: Read outstanding supplier invoice balances
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /purchases/source-trace:
    get:
      tags: [Purchases]
      operationId: getPurchaseSourceTrace
      summary: Trace purchase sources through items, locations and downstream sales
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /purchases/invoices/{invoiceId}:
    get:
      tags: [Purchases]
      operationId: getPurchaseInvoice
      summary: Read a posted purchase invoice
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /purchases/invoices/{invoiceId}/items:
    get:
      tags: [Purchases]
      operationId: getPurchaseInvoiceItems
      summary: Read purchase invoice item snapshots and remaining returnable quantities
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200': { $ref: '#/components/responses/JsonResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
