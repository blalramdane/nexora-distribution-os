        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Purchase Imports]
      operationId: uploadPurchaseImports
      summary: Upload up to ten purchase invoice images or PDFs
