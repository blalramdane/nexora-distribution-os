components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: Token returned by POST /auth/login. Use the current user's token; tenant scope is resolved server-side.
  parameters:
    SearchQuery:
      name: q
      in: query
      required: false
      description: Optional server-side search query. Exact fields depend on the resource endpoint.
      schema: { type: string, maxLength: 255 }
    PerPage:
      name: per_page
      in: query
      required: false
      description: Pagination page size for customer/supplier history responses.
      schema: { type: integer, minimum: 10, maximum: 50, default: 25 }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    TripId:
      name: trip
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
  schemas:
    Ulid:
      type: string
      minLength: 26
      maxLength: 26
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: ULID identifier.
    OpenRequest:
      type: object
      additionalProperties: true
      description: |
        JSON object for a currently implemented endpoint whose exact field-level schema is
        not yet fully captured in this contract. Only fields accepted by the live controller
        are valid; unknown fields are not guaranteed to be ignored.
    CustomerProductPriceRequest:
      type: object
      additionalProperties: false
      required: [product_id, unit_price]
      properties:
        product_id: { $ref: '#/components/schemas/Ulid' }
        packaging_id: { type: [string, 'null'], minLength: 26, maxLength: 26, description: Null means the product's base unit. }
        unit_price: { type: number, minimum: 0, maximum: 1000000000 }
    SharedInvoiceResponse:
      type: object
      required: [invoice]
      properties:
        invoice:
          type: object
          required: [document_number, invoice_date, party_name, subtotal, discount, tax, total, currency, items]
          properties:
            document_number: { type: string }
            invoice_date: { type: string, format: date }
            party_name: { type: string }
            subtotal: { type: [string, number] }
            discount: { type: [string, number] }
            tax: { type: [string, number] }
            total: { type: [string, number] }
            currency: { type: string, minLength: 3, maxLength: 3 }
            items:
              type: array
              items:
                type: object
                required: [product_name_snapshot, sku_snapshot, quantity, unit_price, line_total]
                properties:
                  product_name_snapshot: { type: string }
                  sku_snapshot: { type: string }
                  quantity: { type: [string, number] }
                  unit_price: { type: [string, number] }
                  line_total: { type: [string, number] }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [organization_id, login, password, device_name]
      properties:
        organization_id: { $ref: '#/components/schemas/Ulid' }
        login: { type: string, maxLength: 255, description: User email or phone. }
        password: { type: string, format: password }
        device_name: { type: string, maxLength: 128 }
    User:
      type: object
      required: [id, organization_id, name, status, roles, permissions]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        organization_id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        status: { type: string }
        roles:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              name: { type: string }
        permissions:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              name: { type: string }
    LoginResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token: { type: string, description: Store securely; do not log or expose the token. }
        token_type: { type: string, const: Bearer }
        user: { $ref: '#/components/schemas/User' }
    SupplierCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: [string, 'null'], maxLength: 64, description: Optional organization-scoped supplier code; generated when omitted. }
        phone: { type: [string, 'null'], maxLength: 32 }
        tax_number: { type: [string, 'null'], maxLength: 128 }
        address_text: { type: [string, 'null'], maxLength: 2000 }
        notes: { type: [string, 'null'], maxLength: 5000 }
    SupplierRebateRequest:
      type: object
      additionalProperties: false
      required: [period_from, period_to, rate_percent]
      properties:
        period_from: { type: string, format: date }
        period_to: { type: string, format: date, description: Must be on or after period_from. }
        rate_percent: { type: number, exclusiveMinimum: 0, maximum: 100, description: Percent of each included posted invoice total. }
        notes: { type: [string, 'null'], maxLength: 2000 }
    PurchaseExtractionRequest:
      type: object
      additionalProperties: false
      required: [extracted_text, ocr_engine]
      properties:
        extracted_text: { type: string, maxLength: 150000 }
        extraction_json: { type: [object, 'null'], additionalProperties: true }
        ocr_engine: { type: string, maxLength: 64 }
        ocr_confidence: { type: [number, 'null'], minimum: 0, maximum: 100 }
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 255
      description: Stable key for safe retries of the same operation.
    PurchaseRequest:
      type: object
      additionalProperties: false
      required: [supplier_id, location_id, idempotency_key, items]
      properties:
        supplier_id: { $ref: '#/components/schemas/Ulid' }
        location_id: { $ref: '#/components/schemas/Ulid' }
        supplier_invoice_number: { type: [string, 'null'], maxLength: 255 }
        invoice_date: { type: [string, 'null'], format: date }
        currency: { type: [string, 'null'], minLength: 3, maxLength: 3 }
        discount: { type: [number, 'null'], minimum: 0, description: Non-zero purchase header discounts remain fail-closed pending approved costing policy. }
        tax: { type: [number, 'null'], minimum: 0, description: Non-zero tax remains fail-closed pending approved accounting policy. }
        idempotency_key: { $ref: '#/components/schemas/IdempotencyKey' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseItem' }
    PurchaseItem:
      type: object
      required: [quantity, unit_cost]
      properties:
        product_id: { $ref: '#/components/schemas/Ulid' }
        new_product: { $ref: '#/components/schemas/NewProductDraft' }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_cost: { type: number, minimum: 0 }
        unit_id: { $ref: '#/components/schemas/Ulid' }
        packaging_id: { $ref: '#/components/schemas/Ulid' }
      oneOf:
        - required: [product_id]
        - required: [new_product]
      description: Provide exactly one of product_id or new_product; the server rejects both or neither.
    NewProductDraft:
      type: object
      required: [name_ar, base_unit_id]
      properties:
        name_ar: { type: string, minLength: 1, maxLength: 255 }
        sku: { type: string, maxLength: 128, description: Optional internal SKU; server generates a value when omitted. }
        base_unit_id: { $ref: '#/components/schemas/Ulid' }
        supplier_sku: { type: string, maxLength: 128 }
        supplier_name: { type: string, maxLength: 255 }
        name_en: { type: string, maxLength: 255 }
        brand: { type: string, maxLength: 255 }
        category_id: { $ref: '#/components/schemas/Ulid' }
        default_piece_price: { type: number, minimum: 0 }
        purchase_packaging_name: { type: [string, 'null'], maxLength: 255, description: Supplier purchase-package label when a newly added product is received in cartons or packs. }
        purchase_packaging_unit_id:
          description: Unit used for the purchase package, such as carton.
          anyOf:
            - { $ref: '#/components/schemas/Ulid' }
            - { type: 'null' }
        purchase_conversion_to_base: { type: [number, string, 'null'], exclusiveMinimum: 0, description: Base-unit quantity contained in one purchase package; required with package label/unit when greater than one. }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name_ar, base_unit_id]
      properties:
        sku: { type: string, minLength: 1, maxLength: 128, description: Operator-provided catalog SKU; unique within the organization. }
        name_ar: { type: string, minLength: 1, maxLength: 255 }
        brand: { type: [string, 'null'], maxLength: 255 }
        category_id: { type: [string, 'null'], minLength: 26, maxLength: 26 }
        base_unit_id: { $ref: '#/components/schemas/Ulid', description: Base inventory unit, normally one piece. }
        carton_unit_id: { type: [string, 'null'], minLength: 26, maxLength: 26 }
        pieces_per_carton: { type: integer, minimum: 1, description: Number of base pieces contained in one carton. }
        carton_purchase_price: { type: [number, 'null'], minimum: 0, description: Supplier cost per carton; the server derives default piece cost from the conversion factor. }
        default_cost: { type: number, minimum: 0, description: Legacy/base-unit cost used when carton_purchase_price is not supplied. }
        default_piece_price: { type: number, minimum: 0 }
        color: { type: [string, 'null'], maxLength: 100, description: Optional product attribute supported when the preview database schema has the color column. }
        supplier_id: { type: [string, 'null'], minLength: 26, maxLength: 26, description: Optional preferred supplier. }
        supplier_sku: { type: [string, 'null'], maxLength: 128, description: Supplier-specific code, separate from the catalog SKU. }
        supplier_name: { type: [string, 'null'], maxLength: 255 }
        initial_cartons: { type: integer, minimum: 0, default: 0 }
        initial_pieces: { type: integer, minimum: 0, default: 0, description: Loose pieces outside cartons. }
        initial_location_id: { type: [string, 'null'], minLength: 26, maxLength: 26, description: Required when initial stock is greater than zero; must be an active warehouse. }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      properties:
        sku: { type: string, minLength: 1, maxLength: 128 }
        name_ar: { type: string, minLength: 1, maxLength: 255 }
        brand: { type: [string, 'null'], maxLength: 255 }
        category_id: { type: [string, 'null'], minLength: 26, maxLength: 26 }
        base_unit_id: { $ref: '#/components/schemas/Ulid', description: Cannot be changed after operational history exists. }
        default_cost: { type: number, minimum: 0 }
        default_piece_price: { type: number, minimum: 0 }
        carton_unit_id: { $ref: '#/components/schemas/Ulid', description: Must be provided together with pieces_per_carton when editing a carton. }
        pieces_per_carton: { type: integer, minimum: 1, description: Must be provided together with carton_unit_id. }
        carton_purchase_price: { type: [number, 'null'], minimum: 0 }
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name_ar]
      properties:
        name_ar: { type: string, minLength: 1, maxLength: 180 }
        code: { type: [string, 'null'], maxLength: 64, description: Generated when omitted. }
        parent_id: { type: [string, 'null'], minLength: 26, maxLength: 26 }
    CreateWarehouseRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        code: { type: [string, 'null'], maxLength: 64, description: Generated when omitted. }
        address: { type: [string, 'null'], maxLength: 2000 }
        type: { type: string, enum: [warehouse], default: warehouse }
    SupplierProductLinkRequest:
      type: object
      additionalProperties: false
      required: [supplier_id]
      properties:
        supplier_id: { $ref: '#/components/schemas/Ulid' }
        supplier_sku: { type: [string, 'null'], maxLength: 128 }
        supplier_name: { type: [string, 'null'], maxLength: 255 }
        packaging_id: { type: [string, 'null'], minLength: 26, maxLength: 26, description: Existing purchase packaging for this product. }
        carton_unit_id: { type: [string, 'null'], minLength: 26, maxLength: 26, description: Unit for an optional supplier-specific carton size. }
        pieces_per_carton: { type: integer, minimum: 1, description: Optional base-piece conversion if this supplier uses a different carton. }
        carton_purchase_price: { type: [number, 'null'], minimum: 0, description: Stored as this supplier's last cost per base piece without overwriting the catalog's other supplier costs. }
    CreateFinancialAccountRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        type: { type: string, enum: [cash, wallet, bank, other] }
        currency: { type: [string, 'null'], minLength: 3, maxLength: 3, description: Defaults to the organization's base currency. }
        opening_balance: { type: number, minimum: 0, default: 0 }
    CreatePaymentMethodRequest:
      type: object
      additionalProperties: false
      required: [name_ar, code]
      properties:
        name_ar: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, pattern: '^[a-zA-Z0-9_-]+$', maxLength: 32 }
        requires_reference: { type: boolean, default: true }
    SaleRequest:
      type: object
      additionalProperties: false
      required: [customer_id, location_id, idempotency_key, items]
      properties:
        customer_id: { $ref: '#/components/schemas/Ulid' }
        location_id: { $ref: '#/components/schemas/Ulid' }
        trip_id: { $ref: '#/components/schemas/Ulid' }
        invoice_date: { type: [string, 'null'], format: date }
        discount: { type: number, minimum: 0 }
        tax: { type: number, minimum: 0, description: Non-zero tax is rejected pending approved tax-account policy. }
        paid_amount: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        notes: { type: string }
        idempotency_key: { $ref: '#/components/schemas/IdempotencyKey' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SaleItem' }
    SaleItem:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id: { $ref: '#/components/schemas/Ulid' }
        quantity: { type: number, exclusiveMinimum: 0 }
        conversion_factor: { type: number, exclusiveMinimum: 0 }
        unit_price: { type: number, minimum: 0 }
        packaging_id: { $ref: '#/components/schemas/Ulid' }
        unit_id: { $ref: '#/components/schemas/Ulid' }
    PaymentRequest:
      type: object
      additionalProperties: false
      required: [party_type, party_id, financial_account_id, payment_method_id, direction, amount, idempotency_key]
      properties:
        party_type: { type: string, enum: [customer, supplier] }
        party_id: { $ref: '#/components/schemas/Ulid' }
        financial_account_id: { $ref: '#/components/schemas/Ulid' }
        payment_method_id: { $ref: '#/components/schemas/Ulid' }
        direction: { type: string, enum: [inbound, outbound] }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        payment_date: { type: string, format: date }
        reference: { type: string, maxLength: 255 }
        trip_id: { $ref: '#/components/schemas/Ulid' }
        idempotency_key: { $ref: '#/components/schemas/IdempotencyKey' }
        allocations:
          type: array
          items:
            type: object
            required: [document_type, document_id, amount]
            properties:
              document_type: { type: string, enum: [sales_invoice, purchase_invoice] }
              document_id: { $ref: '#/components/schemas/Ulid' }
              amount: { type: number, exclusiveMinimum: 0 }
    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [vehicle_id, rep_user_id, origin_location_id]
      properties:
        vehicle_id: { $ref: '#/components/schemas/Ulid' }
        rep_user_id: { $ref: '#/components/schemas/Ulid' }
        origin_location_id: { $ref: '#/components/schemas/Ulid' }
        trip_date: { type: string, format: date }
        notes: { type: string }
    PostedDocument:
      type: object
      description: Transaction response; exact fields depend on operation and include the posted document identity/number.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        document_number: { type: string }
        status: { type: string }
      additionalProperties: true
    Error:
      type: object
      properties:
        message: { type: string }
    ValidationErrors:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    JsonResponse:
      description: Successful JSON response. Resource shape is operation-specific.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: string
    PostedDocument:
      description: Business transaction accepted and posted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PostedDocument' }
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: User does not have permission or active tenant context.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist in the current organization or its file is missing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid request fields or a domain rule blocked the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrors' }
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
