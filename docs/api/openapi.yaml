  /shared/invoice/{token}:
    get:
      tags: [Invoice Sharing]
      operationId: getSharedInvoice
      summary: Read a view-only invoice shared by a valid, unexpired token
      description: Returns limited invoice details; access is logged. The token cannot modify invoice or account data.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9]{64}$', minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Limited invoice details. Response uses private/no-store caching and no-referrer protections.
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, no-store' }
            Referrer-Policy:
              schema: { type: string, example: no-referrer }
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedInvoiceResponse' }
