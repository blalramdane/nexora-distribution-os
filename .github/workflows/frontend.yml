name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8017/api/v1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3027
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, intl
          coverage: none
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Bootstrap isolated SQLite Alpha
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
          if ! php artisan nexora:local-alpha > /tmp/nexora-alpha-bootstrap.log 2>&1; then
            cat /tmp/nexora-alpha-bootstrap.log
            exit 1
          fi
      - name: Start backend API and verify browser prerequisites
        working-directory: backend
        run: |
          php artisan serve --host=127.0.0.1 --port=8017 > /tmp/nexora-api.log 2>&1 &
          echo $! > /tmp/nexora-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8017/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8017/api/v1/health >/dev/null; then
            cat /tmp/nexora-api.log
            exit 1
          fi

          # Verify the actual browser origin is allowed before Playwright runs.
          curl --silent --show-error --output /dev/null --dump-header /tmp/nexora-cors-headers.txt \
            --request OPTIONS http://127.0.0.1:8017/api/v1/auth/login \
            --header 'Origin: http://127.0.0.1:3027' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: accept,content-type'
          if ! grep -qi '^Access-Control-Allow-Origin: http://127.0.0.1:3027' /tmp/nexora-cors-headers.txt; then
            cat /tmp/nexora-cors-headers.txt
            cat /tmp/nexora-api.log
            exit 1
          fi

          # Validate demo credentials without printing or logging the password or bearer token.
          credential_file=../.local-alpha-credentials.txt
          organization_id="$(sed -n 's/^Organization ID: //p' "$credential_file" | head -n 1 | tr -d '\r')"
          login_email="$(sed -n 's/^Login email: //p' "$credential_file" | head -n 1 | tr -d '\r')"
          login_password="$(sed -n 's/^Password: //p' "$credential_file" | head -n 1 | tr -d '\r')"
          if [ -z "$organization_id" ] || [ -z "$login_email" ] || [ -z "$login_password" ]; then
            echo "Local Alpha credentials file is incomplete."
            exit 1
          fi
          payload="$(jq -cn --arg org "$organization_id" --arg login "$login_email" --arg password "$login_password" '{organization_id:$org,login:$login,password:$password,device_name:"NEXORA CI smoke"}')"
          login_status="$(curl --silent --show-error --output /tmp/nexora-login.json --write-out '%{http_code}' \
            --header 'Accept: application/json' --header 'Content-Type: application/json' \
            --data "$payload" http://127.0.0.1:8017/api/v1/auth/login)"
          unset login_password payload
          if [ "$login_status" != "200" ] || ! jq -e '.token | select(type == "string" and length > 0)' /tmp/nexora-login.json >/dev/null; then
            echo "Local Alpha API login smoke failed (HTTP $login_status)."
            jq -c '{message,errors}' /tmp/nexora-login.json || true
            cat /tmp/nexora-api.log
            exit 1
          fi
          echo "API health, CORS preflight, and Local Alpha authentication smoke checks passed."
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
      - name: Print redacted Playwright failure context
        if: failure()
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in sorted(Path("test-results").rglob("error-context.md")):
              content = path.read_text(errors="replace")
              # Avoid accidentally printing secrets if a future test includes sensitive form data.
              content = re.sub(r"(?im)^.*(?:password|authorization|access[_ -]?token|refresh[_ -]?token).*$", "[REDACTED SENSITIVE LINE]", content)
              print(f"\n--- Playwright context: {path} ---")
              print(content[-18000:])
          PY
